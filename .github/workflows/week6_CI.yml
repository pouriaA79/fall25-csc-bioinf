name: week6

on:
  push:
    paths:
      - "week6/**"
      - ".github/workflows/week6_CI.yml"
  pull_request:
    paths:
      - "week6/**"
      - ".github/workflows/week6_CI.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3) System deps
      - name: Install system deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl unzip pkg-config \
            libssl-dev zlib1g-dev clang cmake \
            libxml2-dev libxslt1-dev libhdf5-dev

      # 4) Rust (برای simpleaf و alevin-fry)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 5) Cache Cargo
      - name: Cache cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('.github/workflows/week_CI.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 6) نصب ابزارها و پکیج‌ها
      - name: Install CLI tools and Python libs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          # Python basics
          python -m pip install --upgrade pip
          pip install jupyter nbconvert
          pip install numpy pandas matplotlib scipy anndata
          pip install "scanpy>=1.9" leidenalg
          pip install "celltypist>=1.6"

          # Rust-based CLIs (بیلد از سورس)
          cargo install simpleaf --locked
          cargo install alevin-fry --locked

          # === piscem از ریلیز آماده و نصب مطمئن ===
          # نسخه رو اگر خواستی pin کن؛ اینجا یک نسخه پایدار نمونه گذاشتم:
          PISCEM_VER="v0.10.3"
          curl -fsSL "https://github.com/COMBINE-lab/piscem/releases/download/${PISCEM_VER}/piscem-x86_64-unknown-linux-gnu.tar.gz" -o piscem.tar.gz
          mkdir -p piscem_unpack
          tar -xzf piscem.tar.gz -C piscem_unpack
          # پیدا کردن باینری piscem هرجا که هست:
          PISCEM_BIN="$(find piscem_unpack -type f -name 'piscem' | head -n1)"
          if [[ -z "${PISCEM_BIN}" ]]; then
            echo "ERROR: piscem binary not found inside tarball."
            find piscem_unpack -maxdepth 3 -type f | sed 's/^/[HINT] /' || true
            exit 1
          fi
          sudo install -m 0755 "${PISCEM_BIN}" /usr/local/bin/piscem

          # Show versions
          simpleaf --version
          alevin-fry --version
          piscem --version

          # recommended ulimit for piscem
          ulimit -n 2048 || true

      # 7) اجرای نوت‌بوک
      - name: Execute week6 notebook
        shell: bash
        env:
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
          NUMEXPR_NUM_THREADS: "4"
          PATH: ${{ env.PATH }}:$HOME/.cargo/bin
        run: |
          set -euo pipefail
          mkdir -p week6_runtime/out/ci_logs
          jupyter nbconvert \
            --to notebook \
            --execute week6/week6.ipynb \
            --output week6_executed.ipynb \
            --output-dir week6_runtime/out/ci_logs \
            --ExecutePreprocessor.timeout=5400

      # 8) لیست خروجی‌ها
      - name: Tree outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "== week6 af_quant =="
          ls -lah week6_runtime/out/af_quant || true
          echo "== plots =="
          ls -lah week6_runtime/out/*.png || true
          echo "== ci logs =="
          ls -lah week6_runtime/out/ci_logs || true

      # 9) آرتیفکت‌ها
      - name: Upload week6 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-artifacts
          if-no-files-found: warn
          path: |
            week6_runtime/out/ci_logs/week6_executed.ipynb
            week6_runtime/out/af_quant/alevin.raw.h5ad
            week6_runtime/out/af_quant/adata_processed.h5ad
            week6_runtime/out/af_quant/celltypist_summary.tsv
            week6_runtime/out/af_quant/simpleaf_quant_log.json
            week6_runtime/out/af_quant/resolved_paths.json
            week6_runtime/out/af_quant/status_flags.json
            week6_runtime/out/umap_clusters.png
            week6_runtime/out/umap_final.png
            week6_runtime/out/umap_celltypist_only.png

      # 10) لاگ‌ها
      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-logs
          if-no-files-found: warn
          path: |
            week6_runtime/out/ci_logs/**
            week6_runtime/out/af_quant/**/*.log
            week6_runtime/out/af_quant/**/logs/**
