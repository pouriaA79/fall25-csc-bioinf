name: week6

on:
  push:
    paths:
      - "week6/**"
      - ".github/workflows/week6_CI.yml"
  pull_request:
    paths:
      - "week6/**"
      - ".github/workflows/week6_CI.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ALEVIN_FRY_HOME: ${{ github.workspace }}/.alevin-fry
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Ensure bash exists (for %%bash cells)
      - name: Check bash
        shell: bash
        run: |
          set -euo pipefail
          command -v bash
          bash --version

      # 3) Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 4) System deps
      - name: Install system deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl unzip pkg-config libssl-dev git
          mkdir -p "$ALEVIN_FRY_HOME"

      # 5) Rust toolchain
      - name: Set up Rust (stable)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # 6) Install piscem from GitHub (not on crates.io)
      - name: Build & install piscem (from GitHub)
        shell: bash
        run: |
          set -euo pipefail
          echo "==> Building piscem from source ..."
          git clone --depth 1 https://github.com/COMBINE-lab/piscem.git
          cd piscem
          cargo build --release
          echo "$PWD/target/release" >> $GITHUB_PATH
          cd ..
          which piscem
          piscem --help | head -n 3 || true

      # 7) Install alevin-fry & simpleaf from crates.io
      - name: Install alevin-fry / simpleaf
        shell: bash
        run: |
          set -euo pipefail
          cargo install alevin-fry --locked
          cargo install simpleaf   --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          which alevin-fry
          which simpleaf
          alevin-fry --version || true
          simpleaf --version || true

      # 8) Python deps for the notebook
      - name: Install Python deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install \
            jupyter nbconvert \
            scanpy==1.10.1 anndata>=0.10 pandas numpy scipy umap-learn matplotlib seaborn requests \
            celltypist==1.6.3

      # 9) Download Box dataset before executing the notebook
      - name: Download Box dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p week6_runtime/data
          cd week6_runtime/data

          echo "==> Trying to fetch Box folder as zip ..."
          urls=(
            "https://app.box.com/s/lx2xownlrhz3us8496tyu9c4dgade814?download=1"
            "https://app.box.com/index.php?rm=box_download_shared_file&shared_name=lx2xownlrhz3us8496tyu9c4dgade814"
          )
          for u in "${urls[@]}"; do
            echo "Trying: $u"
            if curl -fL --retry 3 -o box_dataset.zip "$u"; then
              echo "Downloaded box_dataset.zip"
              break
            fi
            rm -f box_dataset.zip || true
          done

          if [[ -f box_dataset.zip ]]; then
            echo "==> Extracting dataset ..."
            mkdir -p box_extracted
            unzip -qq -o box_dataset.zip -d box_extracted || true
          else
            echo "⚠️ Could not download dataset. The notebook should have a fallback path."
          fi

          echo "==> Contents of data dir:"
          ls -lah
          find . -maxdepth 2 -type d -print

      # 10) Execute notebook → week6/week6_executed.ipynb
      - name: Execute notebook
        shell: bash
        run: |
          set -euo pipefail
          jupyter nbconvert --to notebook --execute week6/week6.ipynb \
            --ExecutePreprocessor.timeout=0 \
            --output week6_executed --output-dir week6

      # 11) Summarize outputs in logs
      - name: Tree outputs (summary)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "== week6 af_quant =="
          ls -lah week6_runtime/out/af_quant || true
          echo "== plots =="
          ls -lah week6_runtime/out/*.png || true
          echo "== ci logs =="
          ls -lah week6 || true

      # 12) Upload artifacts (notebook + key outputs)
      - name: Upload week6 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-artifacts
          if-no-files-found: warn
          path: |
            week6/week6_executed.ipynb
            week6_runtime/out/af_quant/alevin.raw.h5ad
            week6_runtime/out/af_quant/adata_processed.h5ad
            week6_runtime/out/af_quant/celltypist_summary.tsv
            week6_runtime/out/umap_clusters.png
            week6_runtime/out/umap_celltypist_only.png
            week6_runtime/out/umap_final.png
            week6_runtime/out/af_quant/refbuild/index/**
            week6_runtime/out/af_quant/simpleaf_quant_log.json
            week6_runtime/out/af_quant/status_flags.json
            week6_runtime/out/af_quant/resolved_paths.json

      # 13) (optional) upload full folder for debugging
      - name: Upload full week6 folder (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-full
          if-no-files-found: warn
          path: |
            week6/**
            week6_runtime/**
