name: week6

on:
  push:
    paths:
      - "week6/**"
      - ".github/workflows/week6_CI.yml"
  pull_request:
    paths:
      - "week6/**"
      - ".github/workflows/week6_CI.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # برای ابزارهای Rust (بعضی نسخه‌ها به این متغیر گیر می‌دهند)
      ALEVIN_FRY_HOME: ${{ github.workspace }}/.alevin-fry
      MPLBACKEND: Agg   # برای matplotlib بدون display
      PYTHONUNBUFFERED: "1"

    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Print bash (اطمینان از وجود bash برای سلول‌های %%bash نوت‌بوک)
      - name: Check bash
        shell: bash
        run: |
          set -euo pipefail
          command -v bash
          bash --version

      # 3) Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 4) System deps + Rust toolchain
      - name: Install system deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl unzip pkg-config libssl-dev
          mkdir -p "$ALEVIN_FRY_HOME"

      - name: Set up Rust (stable)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # 5) نصب ابزارهای scRNA از سورس (piscem + alevin-fry + simpleaf)
      - name: Install piscem / alevin-fry / simpleaf
        shell: bash
        run: |
          set -euo pipefail
          echo "PATH before cargo: $PATH"
          cargo --version
          # نصب باینری‌ها
          cargo install piscem --locked
          cargo install alevin-fry --locked
          cargo install simpleaf --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "PATH after cargo: $PATH"
          which piscem
          which alevin-fry
          which simpleaf
          alevin-fry --version || true
          simpleaf --version || true

      # 6) Python deps برای نوت‌بوک (scanpy, celltypist, jupyter, ...)
      - name: Install Python deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install \
            jupyter nbconvert \
            scanpy==1.10.1 anndata>=0.10 pandas numpy scipy umap-learn matplotlib seaborn requests \
            celltypist==1.6.3

      # 7) دانلود دیتاست Box قبل از اجرای نوت‌بوک
      - name: Download Box dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p week6_runtime/data
          cd week6_runtime/data

          echo "==> Trying to fetch Box folder as zip ..."
          urls=(
            "https://app.box.com/s/lx2xownlrhz3us8496tyu9c4dgade814?download=1"
            "https://app.box.com/index.php?rm=box_download_shared_file&shared_name=lx2xownlrhz3us8496tyu9c4dgade814"
          )

          for u in "${urls[@]}"; do
            echo "Trying: $u"
            if curl -fL --retry 3 -o box_dataset.zip "$u"; then
              echo "Downloaded box_dataset.zip"
              break
            fi
            rm -f box_dataset.zip || true
          done

          if [[ -f box_dataset.zip ]]; then
            echo "==> Extracting dataset ..."
            mkdir -p box_extracted
            unzip -qq -o box_dataset.zip -d box_extracted || true
          else
            echo "⚠️ Could not download dataset. The notebook will use its fallback if implemented."
          fi

          echo "==> Contents of data dir:"
          ls -lah
          find . -maxdepth 2 -type d -print

      # 8) اجرای نوت‌بوک week6/week6.ipynb → week6/week6_executed.ipynb
      - name: Execute notebook
        shell: bash
        run: |
          set -euo pipefail
          # زمان اجرا را نامحدود می‌گذاریم تا ایندکس/کوآنت کامل شود
          jupyter nbconvert --to notebook --execute week6/week6.ipynb \
            --ExecutePreprocessor.timeout=0 \
            --output week6_executed --output-dir week6

      # 9) لیست خروجی‌ها برای لاگ
      - name: Tree outputs (summary)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "== week6 af_quant =="
          ls -lah week6_runtime/out/af_quant || true
          echo "== plots =="
          ls -lah week6_runtime/out/*.png || true
          echo "== ci logs =="
          ls -lah week6 || true

      # 10) Artifactهای اصلی (نوت‌بوک اجراشده + نتایج تحلیلی + تصاویر)
      - name: Upload week6 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-artifacts
          if-no-files-found: warn
          path: |
            week6/week6_executed.ipynb
            week6_runtime/out/af_quant/alevin.raw.h5ad
            week6_runtime/out/af_quant/adata_processed.h5ad
            week6_runtime/out/af_quant/celltypist_summary.tsv
            week6_runtime/out/umap_clusters.png
            week6_runtime/out/umap_celltypist_only.png
            week6_runtime/out/umap_final.png
            week6_runtime/out/af_quant/refbuild/index/**
            week6_runtime/out/af_quant/simpleaf_quant_log.json
            week6_runtime/out/af_quant/status_flags.json
            week6_runtime/out/af_quant/resolved_paths.json

      # 11) (اختیاری) فولدر کامل برای دیباگ
      - name: Upload full week6 folder (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-full
          if-no-files-found: warn
          path: |
            week6/**
            week6_runtime/**
