name: week6

on:
  push:
    paths:
      - "week6/**"
      - ".github/workflows/week6_CI.yml"
  pull_request:
    paths:
      - "week6/**"
      - ".github/workflows/week6_CI.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ALEVIN_FRY_HOME: ${{ github.workspace }}/.alevin-fry
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl unzip pkg-config libssl-dev git \
            cmake ninja-build zlib1g-dev liblzma-dev libbz2-dev

          mkdir -p "$ALEVIN_FRY_HOME"
          echo "ALEVIN_FRY_HOME=$ALEVIN_FRY_HOME"

      - name: Set up Rust (stable)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # === Build & install piscem ===
      - name: Build & install piscem (with submodules)
        shell: bash
        run: |
          set -euo pipefail
          echo "==> Cloning piscem with submodules ..."
          git clone --depth 1 --recurse-submodules https://github.com/COMBINE-lab/piscem.git
          cd piscem
          git submodule update --init --recursive
          echo "==> Building piscem (Release) ..."
          cargo build --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"
          cd ..
          which piscem || true
          piscem --help | head -n 5 || true

      # === Install alevin-fry & simpleaf ===
      - name: Install alevin-fry & simpleaf
        shell: bash
        run: |
          set -euo pipefail
          cargo install alevin-fry --locked
          cargo install simpleaf   --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          which alevin-fry || true
          which simpleaf   || true
          alevin-fry --version || true
          simpleaf   --version || true

      # === Python deps for notebook ===
      - name: Install Python deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install \
            jupyter nbconvert \
            scanpy==1.10.1 anndata>=0.10 pandas numpy scipy umap-learn matplotlib seaborn requests \
            celltypist==1.6.3

      # (اختیاری) دایرکتوری‌های ران‌تایم
      - name: Create runtime dirs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p week6_runtime/data
          mkdir -p week6_runtime/out

      # === Execute week6 notebook ===
      - name: Execute week6 notebook
        shell: bash
        env:
          WEEK6_DRIVE_ID: 1xM-ITlS3bcbvHr5f8t7IeYEkS_QuSgDw
        run: |
          set -euo pipefail
          jupyter nbconvert --to notebook --execute week6/week6.ipynb \
            --ExecutePreprocessor.timeout=0 \
            --output week6_executed --output-dir week6

      # === Summarize outputs in logs ===
      - name: Summarize outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "== notebook =="
          ls -lah week6/week6_executed.ipynb || true
    
          echo "== af_quant (if exists) =="
          ls -lah week6/week6_runtime/out/af_quant || true
    
          echo "== plots (if exists) =="
          ls -lah week6/week6_runtime/out/*.png || true



      # === Upload main artifacts ===
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-artifacts
          if-no-files-found: warn
          path: |
            week6/week6_executed.ipynb
            week6/week6_runtime/out/af_quant/alevin.raw.h5ad
            week6/week6_runtime/out/af_quant/adata_processed.h5ad
            week6/week6_runtime/out/af_quant/celltypist_summary.tsv
            week6/week6_runtime/out/umap_clusters.png



