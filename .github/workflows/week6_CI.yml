name: week6

on:
  push:
    paths:
      - "week6/**"
      - ".github/workflows/week6_CI.yml"
  pull_request:
    paths:
      - "week6/**"
      - ".github/workflows/week6_CI.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Python 3.10 (بدون pip cache تا وابسته به requirements.txt نباشیم)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3) System deps برای build و بعضی wheelها
      - name: Install system deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl unzip pkg-config \
            libssl-dev zlib1g-dev clang cmake \
            libxml2-dev libxslt1-dev libhdf5-dev

      # 4) Rust (برای simpleaf و alevin-fry)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 5) Cache Cargo (سریع‌تر شدن نصب‌های بعدی)
      - name: Cache cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('.github/workflows/week_CI.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 6) نصب ابزارها: simpleaf + alevin-fry (cargo) و piscem (باینری آماده)
      - name: Install CLI tools (simpleaf, alevin-fry, piscem)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          # Python basics
          python -m pip install --upgrade pip
          pip install jupyter nbconvert

          # Python libs notebook
          pip install numpy pandas matplotlib scipy anndata
          pip install "scanpy>=1.9" leidenalg
          pip install "celltypist>=1.6"

          # Rust-based CLIs
          cargo install simpleaf --locked
          cargo install alevin-fry --locked

          # piscem از ریلیز آماده (Linux x86_64)
          curl -fsSL https://github.com/COMBINE-lab/piscem/releases/download/v0.10.3/piscem-x86_64-unknown-linux-gnu.tar.gz -o piscem.tar.gz
          tar -xzf piscem.tar.gz
          sudo mv piscem /usr/local/bin/
          sudo chmod +x /usr/local/bin/piscem

          # Show versions
          simpleaf --version
          alevin-fry --version
          piscem --version

          # recommended ulimit for piscem
          ulimit -n 2048 || true

      # 7) اجرای نوت‌بوک (self-contained)
      - name: Execute week6 notebook
        shell: bash
        env:
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
          NUMEXPR_NUM_THREADS: "4"
          PATH: ${{ env.PATH }}:$HOME/.cargo/bin
        run: |
          set -euo pipefail
          mkdir -p week6_runtime/out/ci_logs
          jupyter nbconvert \
            --to notebook \
            --execute week6/week6.ipynb \
            --output week6_executed.ipynb \
            --output-dir week6_runtime/out/ci_logs \
            --ExecutePreprocessor.timeout=5400

      # 8) نمایش خلاصه خروجی‌ها برای sanity
      - name: Tree outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "== week6 af_quant =="
          ls -lah week6_runtime/out/af_quant || true
          echo "== plots =="
          ls -lah week6_runtime/out/*.png || true
          echo "== ci logs =="
          ls -lah week6_runtime/out/ci_logs || true

      # 9) آرتیفکت‌های اصلی برای نمره‌دهی
      - name: Upload week6 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-artifacts
          if-no-files-found: warn
          path: |
            week6_runtime/out/ci_logs/week6_executed.ipynb
            week6_runtime/out/af_quant/alevin.raw.h5ad
            week6_runtime/out/af_quant/adata_processed.h5ad
            week6_runtime/out/af_quant/celltypist_summary.tsv
            week6_runtime/out/af_quant/simpleaf_quant_log.json
            week6_runtime/out/af_quant/resolved_paths.json
            week6_runtime/out/af_quant/status_flags.json
            week6_runtime/out/umap_clusters.png
            week6_runtime/out/umap_final.png
            week6_runtime/out/umap_celltypist_only.png

      # 10) لاگ‌ها (برای دیباگ)
      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-logs
          if-no-files-found: warn
          path: |
            week6_runtime/out/ci_logs/**
            week6_runtime/out/af_quant/**/*.log
            week6_runtime/out/af_quant/**/logs/**
