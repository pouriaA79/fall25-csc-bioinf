name: week6

on:
  push:
    paths:
      - "week6/**"
      - ".github/workflows/week6-ci.yml"
  pull_request:
    paths:
      - "week6/**"
      - ".github/workflows/week6-ci.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}   # مهم: شلِ لاگین برای micromamba

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Micromamba env with all tools (conda-forge + bioconda)
      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "1.5.8"
          environment-file: |
            name: scweek6
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
            dependencies:
              - python=3.10
              - jupyter
              - nbconvert
              - curl
              - unzip
              - pigz
              - aria2
              - pandas
              - numpy
              - scanpy
              - anndata
              - matplotlib
              - simpleaf             # from bioconda
              - alevin-fry           # from bioconda
              - piscem               # from bioconda
              - celltypist           # from conda-forge
          create-args: >-
            --yes
          init-shell: bash
          cache-environment: true
          activate-environment: scweek6

      # اگر دادهٔ واقعی داری، این Secrets را ست کن:
      # URL_REF_FA, URL_REF_GTF, URL_R1, URL_R2, URL_WL
      - name: Export dataset URLs (if provided)
        run: |
          : "${URL_REF_FA:=${{ secrets.URL_REF_FA }}}"
          : "${URL_REF_GTF:=${{ secrets.URL_REF_GTF }}}"
          : "${URL_R1:=${{ secrets.URL_R1 }}}"
          : "${URL_R2:=${{ secrets.URL_R2 }}}"
          : "${URL_WL:=${{ secrets.URL_WL }}}"
          echo "URL_REF_FA=$URL_REF_FA"   >> $GITHUB_ENV
          echo "URL_REF_GTF=$URL_REF_GTF" >> $GITHUB_ENV
          echo "URL_R1=$URL_R1"           >> $GITHUB_ENV
          echo "URL_R2=$URL_R2"           >> $GITHUB_ENV
          echo "URL_WL=$URL_WL"           >> $GITHUB_ENV

      # اجرای نوت‌بوک (self-contained)
      - name: Execute week6 notebook
        working-directory: week6
        run: |
          set -euo pipefail
          jupyter nbconvert --to notebook --execute week6.ipynb \
            --ExecutePreprocessor.timeout=0 \
            --output week6_executed.ipynb

      # نمایش خلاصهٔ خروجی‌ها
      - name: Tree of outputs
        if: always()
        run: |
          set -euo pipefail
          echo "== TREE =="
          find week6 -maxdepth 4 -type d -print | sort
          echo "== files under week6_runtime/out/af_quant =="
          ls -lah week6/week6_runtime/out/af_quant || true
          echo "== figures =="
          ls -lah week6/figures || true

      # آرتیفکت‌ها
      - name: Upload artifacts (key results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-artifacts
          if-no-files-found: warn
          path: |
            week6/week6_executed.ipynb
            week6/figures/*.png
            week6/week6_runtime/out/af_quant/alevin.raw.h5ad
            week6/week6_runtime/out/af_quant/adata_processed.h5ad
            week6/week6_runtime/out/af_quant/adata_annotated.h5ad
            week6/week6_runtime/out/af_quant/celltypist_summary.tsv
            week6/week6_runtime/out/af_quant/simpleaf_quant_log.json
            week6/week6_runtime/out/af_quant/resolved_paths.json
            week6/week6_runtime/out/af_quant/status_flags.json

      # فولدر کامل (اختیاری برای دیباگ)
      - name: Upload full week6 folder (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-folder
          if-no-files-found: warn
          path: |
            week6/**
