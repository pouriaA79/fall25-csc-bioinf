name: Week 4 - Alignment Codon vs Python CI

on:
  push:
    paths:
      - "week4/**"
      - ".github/workflows/week4-ci.yml"
  pull_request:
    paths:
      - "week4/**"
      - ".github/workflows/week4-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. Checkout the repo
      # -----------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Install Codon and seq plugin
      # -----------------------------
      - name: Install Codon and seq plugin
        run: |
          set -euxo pipefail
          CODON_HOME="${HOME}/.codon"
          mkdir -p "${CODON_HOME}/lib/codon/plugins"

          CODON_URL="https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz"
          SEQ_URL="https://github.com/exaloop/seq/releases/download/v0.11.5/seq-linux-x86_64.tar.gz"

          curl -fL "$CODON_URL" -o /tmp/codon.tgz
          curl -fL "$SEQ_URL"   -o /tmp/seq.tgz

          tar -xzf /tmp/codon.tgz -C "${CODON_HOME}" --strip-components=1
          tar -xzf /tmp/seq.tgz   -C "${CODON_HOME}/lib/codon/plugins"

          echo "${CODON_HOME}/bin" >> "$GITHUB_PATH"
          "${CODON_HOME}/bin/codon" --version
          echo "✅ Codon installed successfully"

      # -----------------------------
      # 3. Set up Python 3.11
      # -----------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------
      # 4. Install dependencies and set CODON_PYTHON
      # -----------------------------
      - name: Install Python dependencies and set libpython
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y python3-dev
          pip install numpy biopython matplotlib find_libpython

          # پیدا کردن libpython.so برای Codon
          LIBPY=$(find /usr/lib -name "libpython3.11.so" | head -n 1)
          if [ -z "$LIBPY" ]; then
            LIBPY=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")/libpython3.11.so
          fi
          echo "CODON_PYTHON=$LIBPY" >> $GITHUB_ENV
          echo "✅ Python dependencies installed. libpython found at: $LIBPY"

      # -----------------------------
      # 5. Run evaluate.sh
      # -----------------------------
      - name: Run evaluate.sh (Python + Codon tests)
        run: |
          set -euxo pipefail
          cd week4
          chmod +x evaluate.sh
          bash evaluate.sh | tee evaluate_output.txt
          echo "✅ Tests completed."

      # -----------------------------
      # 6. Upload benchmark results
      # -----------------------------
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: week4-results
          path: |
            week4/evaluate_output.txt
