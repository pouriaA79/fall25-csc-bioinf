name: week5

on:
  push:
    paths:
      - "week5/**"
      - ".github/workflows/week5-ci.yml"
  pull_request:
    paths:
      - "week5/**"
      - ".github/workflows/week5-ci.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Python + ابزارهای لازم
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (bcftools/samtools/tabix/bedtools/minimap2)
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools samtools tabix bedtools minimap2 curl gzip
          python -m pip install --upgrade pip
          pip install jupyter nbconvert nbformat

      # 3) پیش‌ساخت دایرکتوری‌های احتمالی (هر دو حالت نوت‌بوک)
      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p week5/data
          mkdir -p week5/week5/data

      # 4) اجرای نوت‌بوک
      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute week5/week5.ipynb \
            --ExecutePreprocessor.timeout=7200 \
            --output week5.out --output-dir week5

      # 5) اگر vcfstats نبود، بساز (هر دو مسیر)
      - name: Ensure vcfstats exist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d week5/data ]]; then
            datadir="week5/data"
          elif [[ -d week5/week5/data ]]; then
            datadir="week5/week5/data"
          else
            echo "[INFO] no data dir found, skipping vcfstats."
            exit 0
          fi

          cd "$datadir"
          ILL="illumina.cyp2c.filtered.vcf.gz"
          PAC="pacbio.cyp2c.filtered.vcf.gz"

          if [[ -s "$ILL" && -s "$PAC" ]]; then
            [[ -s "$ILL.tbi" ]] || tabix -f -p vcf "$ILL" || true
            [[ -s "$PAC.tbi" ]] || tabix -f -p vcf "$PAC" || true
            [[ -s illumina.vcfstats.txt ]] || bcftools stats "$ILL" > illumina.vcfstats.txt || true
            [[ -s pacbio.vcfstats.txt  ]] || bcftools stats "$PAC"  > pacbio.vcfstats.txt  || true
          else
            echo "[INFO] VCFs not found, skipping bcftools stats."
          fi

      # 6) لیست خروجی‌ها فقط زیر week5/ و بدون خطا برای igv_snapshots
      - name: Tree outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "== TREE under week5 =="
          find week5 -maxdepth 3 -type d -name "data" -print || true

          echo "== Key globs =="
          ls -lah week5/week5.out.ipynb || true

          echo "== week5/data globs =="
          ls -lah week5/data/* 2>/dev/null || true
          ls -lah week5/data/*.vcf.gz* 2>/dev/null || true
          ls -lah week5/data/*.vcfstats.txt 2>/dev/null || true
          ls -lah week5/data/isec/*/* 2>/dev/null || true
          ls -lah week5/data/discordant_sites.tsv 2>/dev/null || true
          ls -lah week5/data/star_allele_helper.tsv 2>/dev/null || true
          if [[ -d week5/data/igv_snapshots ]]; then
            find week5/data/igv_snapshots -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) -maxdepth 3 -print
          fi

          echo "== week5/week5/data globs =="
          ls -lah week5/week5/data/* 2>/dev/null || true
          ls -lah week5/week5/data/*.vcf.gz* 2>/dev/null || true
          ls -lah week5/week5/data/*.vcfstats.txt 2>/dev/null || true
          ls -lah week5/week5/data/isec/*/* 2>/dev/null || true
          ls -lah week5/week5/data/discordant_sites.tsv 2>/dev/null || true
          ls -lah week5/week5/data/star_allele_helper.tsv 2>/dev/null || true
          if [[ -d week5/week5/data/igv_snapshots ]]; then
            find week5/week5/data/igv_snapshots -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) -maxdepth 3 -print
          fi

      # 7) آرتیفکت‌های مهم (هر دو مسیر) — فقط از week5/
      - name: Upload week5 artifacts (selective)
        uses: actions/upload-artifact@v4
        with:
          name: week5-artifacts
          if-no-files-found: warn
          path: |
            week5/week5.out.ipynb

            week5/data/*.vcfstats.txt
            week5/data/illumina.cyp2c.filtered.vcf.gz
            week5/data/illumina.cyp2c.filtered.vcf.gz.tbi
            week5/data/pacbio.cyp2c.filtered.vcf.gz
            week5/data/pacbio.cyp2c.filtered.vcf.gz.tbi
            week5/data/illumina.phased.vcf.gz
            week5/data/illumina.phased.vcf.gz.tbi
            week5/data/pacbio.phased.vcf.gz
            week5/data/pacbio.phased.vcf.gz.tbi
            week5/data/isec/**/*.vcf.gz
            week5/data/isec/**/*.vcf.gz.tbi
            week5/data/discordant_sites.tsv
            week5/data/star_allele_helper.tsv
            week5/data/igv_snapshots/**/*.png
            week5/data/igv_snapshots/**/*.jpg
            week5/data/igv_snapshots/**/*.jpeg

            week5/week5/data/*.vcfstats.txt
            week5/week5/data/illumina.cyp2c.filtered.vcf.gz
            week5/week5/data/illumina.cyp2c.filtered.vcf.gz.tbi
            week5/week5/data/pacbio.cyp2c.filtered.vcf.gz
            week5/week5/data/pacbio.cyp2c.filtered.vcf.gz.tbi
            week5/week5/data/illumina.phased.vcf.gz
            week5/week5/data/illumina.phased.vcf.gz.tbi
            week5/week5/data/pacbio.phased.vcf.gz
            week5/week5/data/pacbio.phased.vcf.gz.tbi
            week5/week5/data/isec/**/*.vcf.gz
            week5/week5/data/isec/**/*.vcf.gz.tbi
            week5/week5/data/discordant_sites.tsv
            week5/week5/data/star_allele_helper.tsv
            week5/week5/data/igv_snapshots/**/*.png
            week5/week5/data/igv_snapshots/**/*.jpg
            week5/week5/data/igv_snapshots/**/*.jpeg

      # 8) آپلود فولدر week5 به‌صورت catch-all (فقط زیر week5/)
      - name: Upload week5 folder (catch-all)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week5-folder
          if-no-files-found: ignore
          path: |
            week5/**
