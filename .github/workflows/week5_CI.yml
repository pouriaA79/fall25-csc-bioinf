name: week5

on:
  push:
    paths:
      - "week5/**"
      - ".github/workflows/week5-ci.yml"
  pull_request:
    paths:
      - "week5/**"
      - ".github/workflows/week5-ci.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # ابزارهای پایه + Java 21 برای IGV + Xvfb برای اجرا بدون نمایشگر
          sudo apt-get install -y minimap2 bcftools samtools tabix bedtools curl unzip xvfb openjdk-21-jre-headless
          python -m pip install --upgrade pip
          pip install jupyter nbconvert

      - name: Execute notebook
        shell: bash
        run: |
          set -euo pipefail
          jupyter nbconvert --to notebook --execute week5/week5.ipynb \
            --ExecutePreprocessor.timeout=0 \
            --output week5.out --output-dir week5

      - name: Ensure vcfstats exist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d week5/data ]]; then
            datadir="week5/data"
          elif [[ -d week5/week5/data ]]; then
            datadir="week5/week5/data"
          else
            echo "[INFO] no data dir found; skipping vcfstats."
            exit 0
          fi
          echo "[INFO] datadir=$datadir"
          cd "$datadir"

          ILL="illumina.cyp2c.filtered.vcf.gz"
          PAC="pacbio.cyp2c.filtered.vcf.gz"

          if [[ -s "$ILL" && -s "$PAC" ]]; then
            [[ -s "$ILL.tbi" ]] || tabix -f -p vcf "$ILL" || true
            [[ -s "$PAC.tbi" ]] || tabix -f -p vcf "$PAC" || true
            [[ -s illumina.vcfstats.txt ]] || bcftools stats "$ILL" > illumina.vcfstats.txt || true
            [[ -s pacbio.vcfstats.txt  ]] || bcftools stats "$PAC"  > pacbio.vcfstats.txt  || true
          else
            echo "[WARN] VCFs not found; skipping stats."
          fi

      - name: Make IGV snapshots (headless)
        if: always()
        shell: bash
        env:
          # برای اطمینان از استفاده IGV از جاوای درست
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
          PATH: /usr/lib/jvm/java-21-openjdk-amd64/bin:${{ env.PATH }}
        run: |
          set -euo pipefail
          if [[ -d week5/data ]]; then
            datadir="week5/data"
          elif [[ -d week5/week5/data ]]; then
            datadir="week5/week5/data"
          else
            echo "[INFO] no data dir found; skipping IGV snapshots."
            exit 0
          fi
          echo "[INFO] datadir=$datadir"
          cd "$datadir"

          REF="chr10.fa"
          BAM1="illumina.chr10.sorted.bam"
          BAM2="pacbio.chr10.sorted.bam"

          if [[ ! -s "$REF" || ! -s "$BAM1" || ! -s "$BAM2" || ! -s "$BAM1.bai" || ! -s "$BAM2.bai" ]]; then
            echo "[INFO] Required files for IGV not found; skipping snapshots."
            exit 0
          fi

          IGV_VER="2.19.6"
          IGV_URL="https://data.broadinstitute.org/igv/projects/downloads/2.19/IGV_${IGV_VER}.zip"
          echo "[INFO] downloading IGV ${IGV_VER} ..."
          curl -fL -o igv.zip "$IGV_URL"
          unzip -q igv.zip
          IGV_DIR="$(pwd)/IGV_${IGV_VER}"
          test -x "$IGV_DIR/igv.sh" || { echo "[ERR] igv.sh not found in $IGV_DIR"; exit 1; }

          BED=".cyp2c.sorted.bed"
          SITES="discordant_sites.tsv"
          SNAPDIR="$(pwd)/igv_snapshots"
          mkdir -p "$SNAPDIR"

          if [[ ! -s "$SITES" ]]; then
            echo -e "chrom\tpos\tgene" > "$SITES"
            if [[ -s isec/shared/0000.vcf.gz && -s "$BED" ]]; then
              while read -r chrom start end gene; do
                region="${chrom}:${start}-${end}"
                bcftools view -r "$region" -H isec/shared/0000.vcf.gz \
                  | awk -v g="$gene" 'NR<=3 {print $1"\t"$2"\t"g}' >> "$SITES"
              done < "$BED"
            else
              printf "chr10\t94938700\tCYP2C9\nchr10\t95036850\tCYP2C8\nchr10\t94762750\tCYP2C19\n" >> "$SITES"
            fi
          fi

          BATCH="$(pwd)/igv.batch"
          {
            printf "new\n"
            printf "genome %s/%s\n" "$(pwd)" "$REF"
            printf "snapshotDirectory %s\n" "$SNAPDIR"
            printf "load %s/%s\n" "$(pwd)" "$BAM1"
            printf "load %s/%s\n" "$(pwd)" "$BAM2"
            printf "preference SAM.SHOW_COVERAGE true\n"
            printf "preference SAM.SHOW_CENTER_LINE true\n"
          } > "$BATCH"

          awk 'BEGIN{OFS="\t"} NR>1 {
                 chrom=$1; pos=$2; gene=$3;
                 start=pos-50; if(start<1) start=1; end=pos+50;
                 fname=gene"_"chrom"_"pos".png";
                 print "goto "chrom":"start"-"end;
                 print "sort base";
                 print "collapse";
                 print "snapshot "fname;
               }' "$SITES" >> "$BATCH"
          echo "exit" >> "$BATCH"

          echo "[INFO] Running IGV batch with Java at: $(java -version 2>&1 | head -n1)"
          # -Djava.util.prefs.userRoot برای جلوگیری از warning/permission
          xvfb-run -a bash -lc "\"$IGV_DIR/igv.sh\" -Djava.util.prefs.userRoot=$(pwd) -b \"$BATCH\""
          echo "[INFO] Snapshots created:"
          ls -lah "$SNAPDIR" || true

      - name: Tree outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "== TREE under week5 =="
          find week5 -maxdepth 3 -type d -print | sort
          echo "== Key outputs =="
          ls -lah week5/week5.out.ipynb || true

          echo "== Check week5/data =="
          ls -lah week5/data || true
          ls -lah week5/data/*.vcf.gz* || true
          ls -lah week5/data/*.vcfstats.txt || true
          ls -lah week5/data/isec/*/* || true
          ls -lah week5/data/discordant_sites.tsv || true
          ls -lah week5/data/star_allele_helper.tsv || true
          ls -lah week5/data/igv_snapshots || true
          find week5/data/igv_snapshots -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) -maxdepth 3 -print || true

          echo "== Check week5/week5/data =="
          ls -lah week5/week5/data || true
          ls -lah week5/week5/data/*.vcf.gz* || true
          ls -lah week5/week5/data/*.vcfstats.txt || true
          ls -lah week5/week5/data/isec/*/* || true
          ls -lah week5/week5/data/discordant_sites.tsv || true
          ls -lah week5/week5/data/star_allele_helper.tsv || true
          ls -lah week5/week5/data/igv_snapshots || true
          find week5/week5/data/igv_snapshots -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) -maxdepth 3 -print || true

      - name: Upload week5 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week5-artifacts
          if-no-files-found: warn
          path: |
            week5/week5.out.ipynb
            week5/data/*.vcfstats.txt
            week5/data/illumina.cyp2c.filtered.vcf.gz
            week5/data/illumina.cyp2c.filtered.vcf.gz.tbi
            week5/data/pacbio.cyp2c.filtered.vcf.gz
            week5/data/pacbio.cyp2c.filtered.vcf.gz.tbi
            week5/data/illumina.phased.vcf.gz
            week5/data/illumina.phased.vcf.gz.tbi
            week5/data/pacbio.phased.vcf.gz
            week5/data/pacbio.phased.vcf.gz.tbi
            week5/data/isec/**/*.vcf.gz
            week5/data/isec/**/*.vcf.gz.tbi
            week5/data/discordant_sites.tsv
            week5/data/star_allele_helper.tsv
            week5/data/igv_snapshots/**/*.png
            week5/data/igv_snapshots/**/*.jpg
            week5/data/igv_snapshots/**/*.jpeg
            week5/week5/data/*.vcfstats.txt
            week5/week5/data/illumina.cyp2c.filtered.vcf.gz
            week5/week5/data/illumina.cyp2c.filtered.vcf.gz.tbi
            week5/week5/data/pacbio.cyp2c.filtered.vcf.gz
            week5/week5/data/pacbio.cyp2c.filtered.vcf.gz.tbi
            week5/week5/data/illumina.phased.vcf.gz
            week5/week5/data/illumina.phased.vcf.gz.tbi
            week5/week5/data/pacbio.phased.vcf.gz
            week5/week5/data/pacbio.phased.vcf.gz.tbi
            week5/week5/data/isec/**/*.vcf.gz
            week5/week5/data/isec/**/*.vcf.gz.tbi
            week5/week5/data/discordant_sites.tsv
            week5/week5/data/star_allele_helper.tsv
            week5/week5/data/igv_snapshots/**/*.png
            week5/week5/data/igv_snapshots/**/*.jpg
            week5/week5/data/igv_snapshots/**/*.jpeg
