name: week5

on:
  push:
    paths:
      - "week5/**"
      - ".github/workflows/week5-ci.yml"
  pull_request:
    paths:
      - "week5/**"
      - ".github/workflows/week5-ci.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3) System deps (Java 21 + Xvfb + bio tools)
      - name: Install system deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # Java 21 (non-headless برای AWT) + Xvfb + X libs لازم برای Swing
          sudo apt-get install -y \
            openjdk-21-jre xvfb libxrender1 libxtst6 libxi6 \
            curl unzip \
            minimap2 bcftools samtools tabix bedtools

          # اطمینان از استفاده Java 21
          if [[ -x /usr/lib/jvm/java-21-openjdk-amd64/bin/java ]]; then
            sudo update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java || true
          fi
          echo "[INFO] java at: $(command -v java)"
          java -version

          # Python deps
          python -m pip install --upgrade pip
          pip install jupyter nbconvert

      # 4) اجرای نوت‌بوک -> week5/week5.out.ipynb
      - name: Execute notebook
        shell: bash
        run: |
          set -euo pipefail
          jupyter nbconvert --to notebook --execute week5/week5.ipynb \
            --ExecutePreprocessor.timeout=0 \
            --output week5.out --output-dir week5

      # 5) ساخت vcfstats (از هر کدوم که وجود داشت)
      - name: Ensure vcfstats exist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d week5/data ]]; then
            datadir="week5/data"
          elif [[ -d week5/week5/data ]]; then
            datadir="week5/week5/data"
          else
            echo "[INFO] no data dir found; skipping vcfstats."
            exit 0
          fi
          echo "[INFO] datadir=$datadir"
          cd "$datadir"

          ILL="illumina.cyp2c.filtered.vcf.gz"
          PAC="pacbio.cyp2c.filtered.vcf.gz"

          if [[ -s "$ILL" && -s "$PAC" ]]; then
            [[ -s "$ILL.tbi" ]] || tabix -f -p vcf "$ILL" || true
            [[ -s "$PAC.tbi" ]] || tabix -f -p vcf "$PAC" || true
            [[ -s illumina.vcfstats.txt ]] || bcftools stats "$ILL" > illumina.vcfstats.txt || true
            [[ -s pacbio.vcfstats.txt  ]] || bcftools stats "$PAC"  > pacbio.vcfstats.txt  || true
          else
            echo "[WARN] VCFs not found; skipping stats."
          fi

      # 6) ساخت IGV snapshots با Java 21 + Xvfb (headful مجازی)
      # 6) ساخت IGV snapshots با Java 21 + Xvfb (headful مجازی)
      - name: Make IGV snapshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
      
          # پیدا کردن مسیر داده
          if [[ -d week5/week5/data ]]; then
            datadir="week5/week5/data"
          elif [[ -d week5/data ]]; then
            datadir="week5/data"
          else
            echo "[INFO] no data dir found; skipping IGV snapshots."
            exit 0
          fi
          echo "[INFO] datadir=$datadir"
          cd "$datadir"
      
          # فایل‌های لازم
          REF="chr10.fa"
          BAM1="illumina.chr10.sorted.bam"
          BAM2="pacbio.chr10.sorted.bam"
          if [[ ! -s "$REF" || ! -s "$BAM1" || ! -s "$BAM2" || ! -s "$BAM1.bai" || ! -s "$BAM2.bai" ]]; then
            echo "[INFO] Required files for IGV not found; skipping snapshots."
            exit 0
          fi
      
          # Java 21
          export JAVA_HOME="/usr/lib/jvm/java-21-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
      
          # IGV دانلود و آماده‌سازی
          IGV_VER="2.19.6"
          IGV_URL="https://data.broadinstitute.org/igv/projects/downloads/2.19/IGV_${IGV_VER}.zip"
          echo "[INFO] downloading IGV ${IGV_VER} ..."
          curl -fL -o igv.zip "$IGV_URL"
          unzip -q -o igv.zip
          IGV_DIR="$(pwd)/IGV_${IGV_VER}"
          test -x "$IGV_DIR/igv.sh" || { echo "[ERR] igv.sh not found"; exit 1; }
      
          # ⚠️ مسیر ثابت برای اسنپ‌شات‌ها: week5/igv_snapshots در ریشه‌ی ریپو
          REPOROOT="$GITHUB_WORKSPACE"
          SNAPDIR="$REPOROOT/week5/igv_snapshots"
          mkdir -p "$SNAPDIR"
      
          # نقاط بازدید
          SITES="discordant_sites.tsv"
          if [[ ! -s "$SITES" ]]; then
            printf "chrom\tpos\tgene\n" > "$SITES"
            printf "chr10\t94938700\tCYP2C9\nchr10\t95036850\tCYP2C8\nchr10\t94762750\tCYP2C19\n" >> "$SITES"
          fi
      
          # ساخت batch IGV با مسیرهای مطلق
          BATCH="$(pwd)/igv.batch"
          {
            echo "new"
            echo "genome $(pwd)/$REF"
            echo "snapshotDirectory $SNAPDIR"
            echo "load $(pwd)/$BAM1"
            echo "load $(pwd)/$BAM2"
            echo "preference SAM.SHOW_COVERAGE true"
            echo "preference SAM.SHOW_CENTER_LINE true"
          } > "$BATCH"
      
          awk 'BEGIN{OFS="\t"} NR>1 {
                 chrom=$1; pos=$2; gene=$3;
                 start=pos-250; if(start<1) start=1; end=pos+250;
                 fname=gene"_"chrom"_"pos".png";
                 print "goto "chrom":"start"-"end;
                 print "sort base";
                 print "collapse";
                 print "snapshot "fname;
               }' "$SITES" >> "$BATCH"
          echo "exit" >> "$BATCH"
      
          # اجرای IGV زیر Xvfb
          unset JAVA_TOOL_OPTIONS || true
          Xvfb :99 -screen 0 1600x1200x24 -nolisten tcp -ac &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 2
      
          echo "[INFO] Running IGV batch (DISPLAY=$DISPLAY) ..."
          set +e
          "$IGV_DIR/igv.sh" -b "$BATCH"
          RC=$?
          set -e
          kill $XVFB_PID || true
      
          echo "[INFO] Final snapshots in: $SNAPDIR"
          ls -lah "$SNAPDIR" || true
      
          exit $RC

      # 7) نشان دادن خروجی‌ها (فقط زیر week5)
      - name: Tree outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "== TREE under week5 =="
          find week5 -maxdepth 3 -type d -print | sort
          echo "== Key outputs =="
          ls -lah week5/week5.out.ipynb || true
          echo "== Check week5/week5/data =="
          ls -lah week5/week5/data || true
          ls -lah week5/week5/data/*.vcf.gz* || true
          ls -lah week5/week5/data/*.vcfstats.txt || true
          ls -lah week5/week5/data/isec/*/* || true
          ls -lah week5/week5/data/discordant_sites.tsv || true
          ls -lah week5/week5/data/star_allele_helper.tsv || true
          ls -lah week5/week5/data/igv_snapshots || true
          find week5/week5/data/igv_snapshots -maxdepth 3 -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) -print || true

      # 8) Artifact اصلی—نتایج ضروری + اسنپ‌شات‌ها
      - name: Upload week5 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week5-artifacts
          if-no-files-found: warn
          path: |
            week5/week5.out.ipynb
            week5/igv_snapshots/**/*.png
            week5/week5/data/*.vcfstats.txt
            week5/week5/data/illumina.cyp2c.filtered.vcf.gz
            week5/week5/data/illumina.cyp2c.filtered.vcf.gz.tbi
            week5/week5/data/pacbio.cyp2c.filtered.vcf.gz
            week5/week5/data/pacbio.cyp2c.filtered.vcf.gz.tbi
            week5/week5/data/isec/**/*.vcf.gz
            week5/week5/data/isec/**/*.vcf.gz.tbi
            week5/week5/data/discordant_sites.tsv
            week5/week5/data/star_allele_helper.tsv
            week5/week5/data/igv_snapshots/**/*.png
            week5/week5/data/igv_snapshots/**/*.jpg
            week5/week5/data/igv_snapshots/**/*.jpeg

      # 9) Artifact کامل فولدر (برای دیباگ—اختیاری)
      - name: Upload full week5 folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week5-folder
          if-no-files-found: warn
          path: |
            week5/**
