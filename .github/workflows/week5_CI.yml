name: week5

on:
  push:
    paths:
      - "week5/**"
      - ".github/workflows/week5-ci.yml"
  pull_request:
    paths:
      - "week5/**"
      - ".github/workflows/week5-ci.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            minimap2 bcftools samtools tabix bedtools \
            curl unzip xvfb openjdk-21-jre-headless
          python -m pip install --upgrade pip
          pip install jupyter nbconvert

      - name: Execute notebook
        shell: bash
        run: |
          set -euo pipefail
          jupyter nbconvert --to notebook --execute week5/week5.ipynb \
            --ExecutePreprocessor.timeout=0 \
            --output week5.out --output-dir week5

      - name: Ensure vcfstats exist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d week5/week5/data ]]; then
            datadir="week5/week5/data"
          elif [[ -d week5/data ]]; then
            datadir="week5/data"
          else
            echo "[INFO] no data dir found; skipping vcfstats."
            exit 0
          fi
          echo "[INFO] datadir=$datadir"
          cd "$datadir"

          ILL="illumina.cyp2c.filtered.vcf.gz"
          PAC="pacbio.cyp2c.filtered.vcf.gz"

          if [[ -s "$ILL" && -s "$PAC" ]]; then
            [[ -s "$ILL.tbi" ]] || tabix -f -p vcf "$ILL" || true
            [[ -s "$PAC.tbi" ]] || tabix -f -p vcf "$PAC" || true
            [[ -s illumina.vcfstats.txt ]] || bcftools stats "$ILL" > illumina.vcfstats.txt || true
            [[ -s pacbio.vcfstats.txt  ]] || bcftools stats "$PAC"  > pacbio.vcfstats.txt  || true
          else
            echo "[WARN] VCFs not found; skipping stats."
          fi

      - name: Make IGV snapshots (headless, coverage-filtered + fallback)
        if: always()
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          set -euo pipefail
          if [[ -d week5/week5/data ]]; then
            datadir="week5/week5/data"
          elif [[ -d week5/data ]]; then
            datadir="week5/data"
          else
            echo "[INFO] no data dir found; skipping IGV snapshots."
            exit 0
          fi
          echo "[INFO] datadir=$datadir"
          cd "$datadir"

          REF="chr10.fa"
          BAM1="illumina.chr10.sorted.bam"
          BAM2="pacbio.chr10.sorted.bam"

          if [[ ! -s "$REF" || ! -s "$BAM1" || ! -s "$BAM2" || ! -s "$BAM1.bai" || ! -s "$BAM2.bai" ]]; then
            echo "[INFO] Required files for IGV not found; skipping snapshots."
            exit 0
          fi

          IGV_VER="2.19.6"
          IGV_URL="https://data.broadinstitute.org/igv/projects/downloads/2.19/IGV_${IGV_VER}.zip"
          echo "[INFO] downloading IGV ${IGV_VER} ..."
          curl -fL -o igv.zip "$IGV_URL"
          unzip -q igv.zip
          IGV_DIR="$(pwd)/IGV_${IGV_VER}"
          test -x "$IGV_DIR/igv.sh" || { echo "[ERR] igv.sh not found in $IGV_DIR"; exit 1; }

          # Java 21
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "[INFO] Java version:"; java -version

          BED=".cyp2c.sorted.bed"
          SITES_IN="discordant_sites.tsv"
          SNAPDIR="$(pwd)/igv_snapshots"
          mkdir -p "$SNAPDIR"

          # اگر discordant_sites نبود، سه نقطهٔ پیش‌فرض
          if [[ ! -s "$SITES_IN" ]]; then
            printf "chrom\tpos\tgene\n" > "$SITES_IN"
            printf "chr10\t94938700\tCYP2C9\nchr10\t95036850\tCYP2C8\nchr10\t94762750\tCYP2C19\n" >> "$SITES_IN"
          fi

          # فیلتر با پنجرهٔ بزرگ‌تر ±250bp در هر دو BAM
          SITES_FLT="$(pwd)/sites_for_igv.tsv"
          printf "chrom\tpos\tgene\n" > "$SITES_FLT"
          awk 'NR>1 && $1!="" && $2~/^[0-9]+$/ {print $1,$2,$3}' OFS="\t" "$SITES_IN" | \
          while IFS=$'\t' read -r chrom pos gene; do
            start=$((pos-250)); if (( start < 1 )); then start=1; fi
            end=$((pos+250))
            region="${chrom}:${start}-${end}"
            c1=$(samtools view -c "$BAM1" "$region" || echo 0)
            c2=$(samtools view -c "$BAM2" "$region" || echo 0)
            if [[ "$c1" -gt 0 && "$c2" -gt 0 ]]; then
              printf "%s\t%s\t%s\n" "$chrom" "$pos" "$gene" >> "$SITES_FLT"
            fi
          done

          # اگر بعد از فیلتر هیچ‌چیز نماند، از ورودی اصلی استفاده کن
          if [[ $(awk 'END{print NR}' "$SITES_FLT") -le 1 ]]; then
            echo "[WARN] no covered sites in both BAMs; using fallback sites."
            cp "$SITES_IN" "$SITES_FLT"
          fi

          # ساخت batch
          BATCH="$(pwd)/igv.batch"
          : > "$BATCH"
          printf "new\n"                                   >> "$BATCH"
          printf "genome %s/%s\n" "$(pwd)" "$REF"          >> "$BATCH"
          printf "snapshotDirectory %s\n" "$SNAPDIR"       >> "$BATCH"
          printf "load %s/%s\n" "$(pwd)" "$BAM1"           >> "$BATCH"
          printf "load %s/%s\n" "$(pwd)" "$BAM2"           >> "$BATCH"
          printf "preference SAM.SHOW_COVERAGE true\n"     >> "$BATCH"
          printf "preference SAM.SHOW_CENTER_LINE true\n"  >> "$BATCH"

          awk 'BEGIN{OFS="\t"} NR>1 {
                 chrom=$1; pos=$2; gene=$3;
                 start=pos-250; if(start<1) start=1; end=pos+250;
                 fname=gene"_"chrom"_"pos".png";
                 print "goto "chrom":"start"-"end;
                 print "sort base";
                 print "collapse";
                 print "snapshot "fname;
               }' "$SITES_FLT" >> "$BATCH"
          echo "exit" >> "$BATCH"

          echo "[INFO] Running IGV batch..."
          xvfb-run -a bash -lc "\"$IGV_DIR/igv.sh\" -b \"$BATCH\" || true"

          echo "[INFO] Snapshots after first run:"; ls -lah "$SNAPDIR" || true

          # اگر هنوز هیچ اسنپ‌شاتی نیست، یک locus پُرکاوریج را خودکار پیدا کن و اسنپ‌شات بگیر
          if ! ls "$SNAPDIR"/*.{png,jpg,jpeg} >/dev/null 2>&1; then
            echo "[WARN] No snapshots created. Trying high-coverage fallback..."
            # از BED، اولین ژن را بردار و عمق را روی BAM1 حساب کن، max-pos را بگیر
            if [[ -s "$BED" ]]; then
              read -r bedChrom bedStart bedEnd bedGene < "$BED"
              region="${bedChrom}:${bedStart}-${bedEnd}"
              top=$(samtools depth -r "$region" "$BAM1" 2>/dev/null | sort -k3,3nr | head -n1)
              if [[ -n "$top" ]]; then
                tchrom=$(echo "$top" | awk '{print $1}')
                tpos=$(echo "$top"   | awk '{print $2}')
                tgene=${bedGene:-Fallback}
                FALLBATCH="$(pwd)/igv_fallback.batch"
                {
                  echo "new"
                  echo "genome $(pwd)/$REF"
                  echo "snapshotDirectory $SNAPDIR"
                  echo "load $(pwd)/$BAM1"
                  echo "load $(pwd)/$BAM2"
                  echo "preference SAM.SHOW_COVERAGE true"
                  echo "preference SAM.SHOW_CENTER_LINE true"
                  echo "goto ${tchrom}:$((tpos-250))-$((tpos+250))"
                  echo "sort base"
                  echo "collapse"
                  echo "snapshot ${tgene}_${tchrom}_${tpos}.png"
                  echo "exit"
                } > "$FALLBATCH"
                xvfb-run -a bash -lc "\"$IGV_DIR/igv.sh\" -b \"$FALLBATCH\" || true"
              fi
            fi
          fi

          echo "[INFO] Final snapshots:"
          ls -lah "$SNAPDIR" || true


      - name: Tree outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "== TREE under week5 =="
          find week5 -maxdepth 3 -type d -print | sort
          echo "== Key outputs =="
          ls -lah week5/week5.out.ipynb || true

          echo "== Check week5/week5/data =="
          ls -lah week5/week5/data || true
          ls -lah week5/week5/data/*.vcf.gz* || true
          ls -lah week5/week5/data/*.vcfstats.txt || true
          ls -lah week5/week5/data/isec/*/* || true
          ls -lah week5/week5/data/discordant_sites.tsv || true
          ls -lah week5/week5/data/star_allele_helper.tsv || true
          ls -lah week5/week5/data/igv_snapshots || true
          find week5/week5/data/igv_snapshots -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) -maxdepth 3 -print || true

      - name: Upload week5 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week5-artifacts
          if-no-files-found: warn
          path: |
            week5/week5.out.ipynb
            week5/week5/data/*.vcfstats.txt
            week5/week5/data/illumina.cyp2c.filtered.vcf.gz
            week5/week5/data/illumina.cyp2c.filtered.vcf.gz.tbi
            week5/week5/data/pacbio.cyp2c.filtered.vcf.gz
            week5/week5/data/pacbio.cyp2c.filtered.vcf.gz.tbi
            week5/week5/data/illumina.phased.vcf.gz
            week5/week5/data/illumina.phased.vcf.gz.tbi
            week5/week5/data/pacbio.phased.vcf.gz
            week5/week5/data/pacbio.phased.vcf.gz.tbi
            week5/week5/data/isec/**/*.vcf.gz
            week5/week5/data/isec/**/*.vcf.gz.tbi
            week5/week5/data/discordant_sites.tsv
            week5/week5/data/star_allele_helper.tsv
            week5/week5/data/igv_snapshots/**/*.png
            week5/week5/data/igv_snapshots/**/*.jpg
            week5/week5/data/igv_snapshots/**/*.jpeg

      - name: Upload full week5 folder (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week5-folder
          if-no-files-found: warn
          path: |
            week5/**
