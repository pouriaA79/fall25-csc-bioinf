name: week5

on:
  push:
    paths:
      - "week5/**"
      - ".github/workflows/week5-ci.yml"
  pull_request:
    paths:
      - "week5/**"
      - ".github/workflows/week5-ci.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Python + ابزارهای لازم
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (bio tools + Jupyter)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bcftools samtools tabix bedtools minimap2 curl
          python -m pip install --upgrade pip
          pip install jupyter nbconvert

      # (اختیاری) اگر پیام MissingIDFieldWarning اذیت می‌کند، فعال کن
      # - name: Normalize notebook IDs (optional)
      #   shell: bash
      #   run: |
      #     python - <<'PY'
      #     import nbformat as nbf
      #     p = "week5/week5.ipynb"
      #     nb = nbf.read(p, as_version=4)
      #     nbf.write(nb, p)
      #     PY

      # 3) اجرای نوت‌بوک (خروجی را week5/week5.out.ipynb بساز)
      - name: Execute notebook
        shell: bash
        run: |
          set -euo pipefail
          jupyter nbconvert \
            --to notebook --execute week5/week5.ipynb \
            --ExecutePreprocessor.timeout=0 \
            --output week5.out --output-dir week5

      # 4) اگر به هر دلیل vcfstats ساخته نشده باشد، اینجا بساز (در صورت وجود data/)
      - name: Ensure vcfstats exist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d week5/data ]]; then
            echo "[INFO] week5/data not present; skipping vcfstats."
            exit 0
          fi
          cd week5/data

          ILL="illumina.cyp2c.filtered.vcf.gz"
          PAC="pacbio.cyp2c.filtered.vcf.gz"

          if [[ -s "$ILL" && -s "$PAC" ]]; then
            [[ -s "$ILL.tbi" ]] || tabix -f -p vcf "$ILL" || true
            [[ -s "$PAC.tbi" ]] || tabix -f -p vcf "$PAC" || true

            [[ -s illumina.vcfstats.txt ]] || bcftools stats "$ILL" > illumina.vcfstats.txt || true
            [[ -s pacbio.vcfstats.txt  ]] || bcftools stats "$PAC"  > pacbio.vcfstats.txt  || true
          else
            echo "[INFO] VCFs not found, skipping bcftools stats."
          fi

      # 5) لیست خروجی‌ها برای دیباگ (همیشه اجرا شود)
      - name: Tree outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "== Find key files =="
          ls -lah week5/week5.out.ipynb || true
          if [[ -d week5/data ]]; then
            ls -lah week5/data/*.vcf.gz*                 || true
            ls -lah week5/data/*.vcfstats.txt            || true
            ls -lah week5/data/isec/*/*                  || true
            ls -lah week5/data/discordant_sites.tsv      || true
            ls -lah week5/data/star_allele_helper.tsv    || true
            ls -lah week5/data/igv_snapshots             || true
            find week5/data/igv_snapshots -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) -maxdepth 3 -print || true
          else
            echo "[INFO] week5/data not present; skipping tree."
          fi

      # 6) آپلود آرتیفکت‌ها (اگر نبود warn بده)
      - name: Upload week5 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: week5-artifacts
          if-no-files-found: warn
          path: |
            week5/week5.out.ipynb
            week5/data/*.vcfstats.txt
            week5/data/illumina.cyp2c.filtered.vcf.gz
            week5/data/illumina.cyp2c.filtered.vcf.gz.tbi
            week5/data/pacbio.cyp2c.filtered.vcf.gz
            week5/data/pacbio.cyp2c.filtered.vcf.gz.tbi
            week5/data/illumina.phased.vcf.gz
            week5/data/illumina.phased.vcf.gz.tbi
            week5/data/pacbio.phased.vcf.gz
            week5/data/pacbio.phased.vcf.gz.tbi
            week5/data/isec/**/*.vcf.gz
            week5/data/isec/**/*.vcf.gz.tbi
            week5/data/discordant_sites.tsv
            week5/data/star_allele_helper.tsv
            week5/data/igv_snapshots/**/*.png
            week5/data/igv_snapshots/**/*.jpg
            week5/data/igv_snapshots/**/*.jpeg
