name: week5

on:
  push:
    paths:
      - "week5/**"
      - ".github/workflows/week5-ci.yml"
  pull_request:
    paths:
      - "week5/**"
      - ".github/workflows/week5-ci.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Python + CLI tools (minimap2 در استیج‌های اول نوت‌بوک، IGV نیاز به Java 21 و xvfb)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minimap2 bcftools samtools tabix bedtools curl unzip xvfb openjdk-21-jre-headless
          python -m pip install --upgrade pip
          pip install jupyter nbconvert

      # 3) Run notebook -> week5/week5.out.ipynb
      - name: Execute notebook
        shell: bash
        run: |
          set -euo pipefail
          jupyter nbconvert --to notebook --execute week5/week5.ipynb \
            --ExecutePreprocessor.timeout=0 \
            --output week5.out --output-dir week5

      # 4) Ensure vcfstats (هم‌خوان با هر دو ساختار data/)
      - name: Ensure vcfstats exist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d week5/week5/data ]]; then
            datadir="week5/week5/data"
          elif [[ -d week5/data ]]; then
            datadir="week5/data"
          else
            echo "[INFO] no data dir found; skipping vcfstats."
            exit 0
          fi
          echo "[INFO] datadir=$datadir"
          cd "$datadir"

          ILL="illumina.cyp2c.filtered.vcf.gz"
          PAC="pacbio.cyp2c.filtered.vcf.gz"

          if [[ -s "$ILL" && -s "$PAC" ]]; then
            [[ -s "$ILL.tbi" ]] || tabix -f -p vcf "$ILL" || true
            [[ -s "$PAC.tbi" ]] || tabix -f -p vcf "$PAC" || true
            [[ -s illumina.vcfstats.txt ]] || bcftools stats "$ILL" > illumina.vcfstats.txt || true
            [[ -s pacbio.vcfstats.txt  ]] || bcftools stats "$PAC"  > pacbio.vcfstats.txt  || true
          else
            echo "[WARN] VCFs not found; skipping stats."
          fi

      # 5) IGV snapshots (headless) + fallback when sites empty
      - name: Make IGV snapshots (headless)
        if: always()
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          set -euo pipefail
          # pick data dir
          if [[ -d week5/week5/data ]]; then
            datadir="week5/week5/data"
          elif [[ -d week5/data ]]; then
            datadir="week5/data"
          else
            echo "[INFO] no data dir found; skipping IGV snapshots."
            exit 0
          fi
          echo "[INFO] datadir=$datadir"
          cd "$datadir"

          REF="chr10.fa"
          BAM1="illumina.chr10.sorted.bam"
          BAM2="pacbio.chr10.sorted.bam"

          if [[ ! -s "$REF" || ! -s "$BAM1" || ! -s "$BAM2" || ! -s "$BAM1.bai" || ! -s "$BAM2.bai" ]]; then
            echo "[INFO] Required REF/BAMs not found; skipping snapshots."
            exit 0
          fi

          # download IGV 2.19.6
          IGV_VER="2.19.6"
          IGV_URL="https://data.broadinstitute.org/igv/projects/downloads/2.19/IGV_${IGV_VER}.zip"
          echo "[INFO] downloading IGV ${IGV_VER} ..."
          curl -fL -o igv.zip "$IGV_URL"
          unzip -q igv.zip
          IGV_DIR="$(pwd)/IGV_${IGV_VER}"
          test -x "$IGV_DIR/igv.sh" || { echo "[ERR] igv.sh not found"; exit 1; }

          BED=".cyp2c.sorted.bed"
          SITES="discordant_sites.tsv"
          SNAPDIR="$(pwd)/igv_snapshots"
          mkdir -p "$SNAPDIR"

          # If SITES missing OR has only header, create fallback positions
          if [[ -s "$SITES" ]]; then
            data_lines=$(awk 'NR>1 && $1!=""{c++} END{print c+0}' "$SITES")
          else
            data_lines=0
          fi
          if [[ "$data_lines" -lt 1 ]]; then
            echo "[INFO] No usable sites; creating fallback."
            printf "chrom\tpos\tgene\n" > "$SITES"
            printf "chr10\t94938700\tCYP2C9\nchr10\t95036850\tCYP2C8\nchr10\t94762750\tCYP2C19\n" >> "$SITES"
          fi

          # Build IGV batch file
          BATCH="$(pwd)/igv.batch"
          : > "$BATCH"
          printf "new\n"                                   >> "$BATCH"
          printf "genome %s/%s\n" "$(pwd)" "$REF"          >> "$BATCH"
          printf "snapshotDirectory %s\n" "$SNAPDIR"       >> "$BATCH"
          printf "load %s/%s\n" "$(pwd)" "$BAM1"           >> "$BATCH"
          printf "load %s/%s\n" "$(pwd)" "$BAM2"           >> "$BATCH"
          printf "preference SAM.SHOW_COVERAGE true\n"     >> "$BATCH"
          printf "preference SAM.SHOW_CENTER_LINE true\n"  >> "$BATCH"

          awk 'BEGIN{OFS="\t"} NR>1 {
                 chrom=$1; pos=$2; gene=$3;
                 start=pos-50; if(start<1) start=1; end=pos+50;
                 fname=gene"_"chrom"_"pos".png";
                 print "goto "chrom":"start"-"end;
                 print "sort base";
                 print "collapse";
                 print "snapshot "fname;
               }' "$SITES" >> "$BATCH"
          echo "exit" >> "$BATCH"

          echo "[INFO] Running IGV batch with Java:"
          java -version || true
          # IGV نیاز به Java 21 دارد؛ runner پیش‌فرض دارد. Xvfb برای headless GUI
          xvfb-run -a bash -lc "\"$IGV_DIR/igv.sh\" -b \"$BATCH\""
          echo "[INFO] Snapshots:"
          ls -lah "$SNAPDIR" || true
          find "$SNAPDIR" -maxdepth 1 -type f -name "*.png" -print || true

      # 6) Show tree only under week5
      - name: Tree outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "== TREE under week5 =="
          find week5 -maxdepth 3 -type d -print | sort
          echo "== Key outputs =="
          ls -lah week5/week5.out.ipynb || true

          echo "== Check week5/week5/data =="
          ls -lah week5/week5/data || true
          ls -lah week5/week5/data/*.vcf.gz* || true
          ls -lah week5/week5/data/*.vcfstats.txt || true
          ls -lah week5/week5/data/isec/*/* || true
          ls -lah week5/week5/data/discordant_sites.tsv || true
          ls -lah week5/week5/data/star_allele_helper.tsv || true
          ls -lah week5/week5/data/igv_snapshots || true
          find week5/week5/data/igv_snapshots -type f -name "*.png" -maxdepth 1 -print || true

      # 7) Upload artifacts (شامل اسنپ‌شات‌ها)
      - name: Upload week5 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week5-artifacts
          if-no-files-found: warn
          path: |
            week5/week5.out.ipynb
            week5/week5/data/*.vcfstats.txt
            week5/week5/data/illumina.cyp2c.filtered.vcf.gz
            week5/week5/data/illumina.cyp2c.filtered.vcf.gz.tbi
            week5/week5/data/pacbio.cyp2c.filtered.vcf.gz
            week5/week5/data/pacbio.cyp2c.filtered.vcf.gz.tbi
            week5/week5/data/isec/**/*.vcf.gz
            week5/week5/data/isec/**/*.vcf.gz.tbi
            week5/week5/data/discordant_sites.tsv
            week5/week5/data/star_allele_helper.tsv
            week5/week5/data/igv_snapshots/**/*.png
