name: week5

on:
  push:
    paths:
      - "week5/**"
      - ".github/workflows/week5-ci.yml"
  pull_request:
    paths:
      - "week5/**"
      - ".github/workflows/week5-ci.yml"
  workflow_dispatch:

jobs:
  run-week5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl bzip2 unzip tabix \
            minimap2 samtools bcftools \
            git make gcc g++ \
            zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev \
            autoconf automake libtool pkg-config \
            xvfb openjdk-17-jre
          minimap2 --version
          samtools --version | head -n1
          bcftools --version | head -n1
          java -version

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert nbclient whatshap


      - name: Execute notebook (Stages 1–6)
        run: |
          jupyter nbconvert --to notebook --execute week5/week5.ipynb \
            --output week5/week5.out.ipynb \
            --ExecutePreprocessor.timeout=10800
      - name: Upload artifacts (results)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week5-results
          path: |
            week5/week5.out.ipynb
            week5/data/*.vcfstats.txt
            week5/data/illumina.cyp2c.filtered.vcf.gz
            week5/data/illumina.cyp2c.filtered.vcf.gz.tbi
            week5/data/pacbio.cyp2c.filtered.vcf.gz
            week5/data/pacbio.cyp2c.filtered.vcf.gz.tbi
            week5/data/illumina.phased.vcf.gz
            week5/data/illumina.phased.vcf.gz.tbi
            week5/data/pacbio.phased.vcf.gz
            week5/data/pacbio.phased.vcf.gz.tbi
            week5/data/isec/**/*
            week5/data/discordant_sites.tsv
            week5/data/star_allele_helper.tsv
            week5/data/igv_snapshots/**/*
